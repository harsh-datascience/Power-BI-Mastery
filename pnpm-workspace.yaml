packages:
  - apps/*
  - packages/*

# NOTE: pnpm 8 (see packageManager) does not resolve `catalog:` specifiers,
# and no workspace package references them, so this catalog is documentation
# of intended versions only. Keep it in sync with apps/web/package.json.
catalog:
  # Core
  next: 14.2.35
  react: 18.2.0
  react-dom: 18.2.0
  typescript: 5.3.3

  # Styling
  tailwindcss: 3.4.1
  postcss: 8.5.26
  autoprefixer: 10.4.17

  # UI
  "@radix-ui/react-slot": 1.0.2
  "@radix-ui/react-dialog": 1.0.5
  "@radix-ui/react-dropdown-menu": 2.0.6
  "@radix-ui/react-navigation-menu": 1.1.4
  "@radix-ui/react-tabs": 1.0.4
  "@radix-ui/react-tooltip": 1.0.7
  "@radix-ui/react-avatar": 1.0.4
  "@radix-ui/react-checkbox": 1.0.4
  "@radix-ui/react-select": 2.0.0
  "@radix-ui/react-separator": 1.0.3
  "@radix-ui/react-scroll-area": 1.0.5
  "@radix-ui/react-collapsible": 1.0.3
  "@radix-ui/react-popover": 1.0.7
  "@radix-ui/react-hover-card": 1.0.7
  "@radix-ui/react-alert-dialog": 1.0.5
  "@radix-ui/react-progress": 1.0.3
  "@radix-ui/react-switch": 1.0.3
  "class-variance-authority": 0.7.0
  clsx: 2.1.0
  tailwind-merge: 2.2.1
  tailwindcss-animate: 1.0.7
  lucide-react: 0.344.0
  framer-motion: 11.0.3

  # Content (plain unified/remark/rehype pipeline, not MDX)
  remark-parse: 11.0.0
  remark-gfm: 4.0.0
  remark-rehype: 11.1.2
  rehype-raw: 7.0.0
  rehype-slug: 6.0.0
  rehype-highlight: 7.0.2
  rehype-stringify: 10.0.1
  unified: 11.0.5
  unist-util-visit: 5.0.0
  gray-matter: 4.0.3

  # Auth
  next-auth: 5.0.0-beta.32
  "@auth/prisma-adapter": 2.11.3
  jose: 5.2.2

  # Database
  "@prisma/client": 5.9.1
  prisma: 5.9.1

  # Validation
  zod: 3.22.4
  "@hookform/resolvers": 3.3.4
  react-hook-form: 7.50.1

  # Utils
  date-fns: 3.3.1
  date-fns-tz: 2.0.0
  slugify: 1.6.6
  diff: 5.2.0

  # Testing
  vitest: 3.2.6
  "@vitest/coverage-v8": 3.2.6
  "@testing-library/react": 14.2.1
  "@testing-library/user-event": 14.5.2
  jsdom: 24.0.0
  playwright: 1.62.1
  "@playwright/test": 1.62.1

  # Dev Tools
  eslint: 8.56.0
  "@typescript-eslint/eslint-plugin": 7.0.2
  "@typescript-eslint/parser": 7.0.2
  eslint-config-next: 14.2.35
  eslint-plugin-tailwindcss: 0.5.11
  prettier: 3.2.5
  prettier-plugin-tailwindcss: 0.5.11

  # Build
  "@next/bundle-analyzer": 14.2.35

catalogs:
  dev:
    vitest: 3.2.6
    "@types/node": 20.11.0
    tsx: 4.7.0
